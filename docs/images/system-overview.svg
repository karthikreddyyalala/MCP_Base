<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="520" fill="#0f1117"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600" letter-spacing="0.5">MCP Knowledge Base - System Overview</text>

  <!-- ── INDEXING SIDE ── -->
  <text x="200" y="76" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="1.5" font-weight="600">INDEXING  (run once)</text>

  <!-- Docs box -->
  <rect x="60" y="90" width="130" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="125" y="117" text-anchor="middle" fill="#94a3b8" font-size="11">📁 your-docs/</text>
  <text x="125" y="135" text-anchor="middle" fill="#64748b" font-size="9">*.md files</text>

  <!-- Arrow docs → index -->
  <line x1="190" y1="122" x2="230" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="115" text-anchor="middle" fill="#475569" font-size="9">read</text>

  <!-- index.py box -->
  <rect x="230" y="90" width="130" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="295" y="112" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">index.py</text>
  <text x="295" y="128" text-anchor="middle" fill="#64748b" font-size="9">400-token chunks</text>
  <text x="295" y="141" text-anchor="middle" fill="#64748b" font-size="9">50-token overlap</text>

  <!-- Arrow index → model -->
  <line x1="360" y1="122" x2="400" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="115" text-anchor="middle" fill="#475569" font-size="9">encode</text>

  <!-- Embedding model box -->
  <rect x="400" y="90" width="140" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="470" y="112" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">all-MiniLM-L6-v2</text>
  <text x="470" y="128" text-anchor="middle" fill="#64748b" font-size="9">384-dim embeddings</text>
  <text x="470" y="141" text-anchor="middle" fill="#64748b" font-size="9">L2-normalized · offline</text>

  <!-- Arrow model → chroma -->
  <line x1="540" y1="122" x2="580" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="115" text-anchor="middle" fill="#475569" font-size="9">store</text>

  <!-- ChromaDB box -->
  <rect x="580" y="90" width="140" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="650" y="112" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">ChromaDB</text>
  <text x="650" y="128" text-anchor="middle" fill="#64748b" font-size="9">~/.mcp-kb/chroma/</text>
  <text x="650" y="141" text-anchor="middle" fill="#64748b" font-size="9">HNSW index · local disk</text>

  <!-- Divider -->
  <line x1="50" y1="195" x2="850" y2="195" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ── QUERY SIDE ── -->
  <text x="450" y="222" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="1.5" font-weight="600">QUERY FLOW  (every question)</text>

  <!-- User -->
  <rect x="40" y="240" width="100" height="54" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="262" text-anchor="middle" fill="#e2e8f0" font-size="20">👤</text>
  <text x="90" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">You</text>

  <!-- Arrow user → claude -->
  <line x1="140" y1="267" x2="185" y2="267" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="163" y="259" text-anchor="middle" fill="#38bdf8" font-size="9">question</text>

  <!-- Claude Desktop -->
  <rect x="185" y="240" width="130" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="261" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Claude Desktop</text>
  <text x="250" y="278" text-anchor="middle" fill="#64748b" font-size="9">decides to call</text>
  <text x="250" y="289" text-anchor="middle" fill="#64748b" font-size="9">search_docs()</text>

  <!-- Arrow claude → server -->
  <line x1="315" y1="267" x2="360" y2="267" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="338" y="259" text-anchor="middle" fill="#475569" font-size="9">stdio</text>
  <text x="338" y="278" text-anchor="middle" fill="#475569" font-size="8">JSON-RPC</text>

  <!-- server.py -->
  <rect x="360" y="240" width="130" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="425" y="261" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">server.py</text>
  <text x="425" y="278" text-anchor="middle" fill="#64748b" font-size="9">MCP server</text>
  <text x="425" y="289" text-anchor="middle" fill="#64748b" font-size="9">embed query</text>

  <!-- Arrow server → chroma -->
  <line x1="490" y1="267" x2="535" y2="267" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="513" y="259" text-anchor="middle" fill="#475569" font-size="9">ANN</text>
  <text x="513" y="278" text-anchor="middle" fill="#475569" font-size="8">search</text>

  <!-- ChromaDB query -->
  <rect x="535" y="240" width="130" height="54" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="261" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">ChromaDB</text>
  <text x="600" y="278" text-anchor="middle" fill="#64748b" font-size="9">cosine similarity</text>
  <text x="600" y="289" text-anchor="middle" fill="#64748b" font-size="9">top-5 chunks</text>

  <!-- Arrow chroma → result -->
  <line x1="665" y1="267" x2="710" y2="267" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result box -->
  <rect x="710" y="240" width="150" height="54" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="785" y="261" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Cited answer</text>
  <text x="785" y="277" text-anchor="middle" fill="#64748b" font-size="9">[source: runbook.md</text>
  <text x="785" y="289" text-anchor="middle" fill="#64748b" font-size="9">:L8-L14]</text>

  <!-- ── PRIVACY NOTE ── -->
  <rect x="40" y="340" width="820" height="80" rx="8" fill="#0a1628" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="60" y="364" fill="#38bdf8" font-size="11" font-weight="600">Privacy model</text>
  <text x="60" y="384" fill="#64748b" font-size="10">Everything inside the dashed box above stays on your machine.</text>
  <text x="60" y="400" fill="#64748b" font-size="10">Only the retrieved snippet (~400 tokens) enters the conversation with Claude - never your full doc corpus.</text>
  <text x="60" y="414" fill="#64748b" font-size="10">The model weights download once from HuggingFace, then all inference runs offline.</text>

  <!-- ── BENCHMARK ── -->
  <text x="450" y="458" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="1.5" font-weight="600">MS MARCO BENCHMARK - MRR@10</text>

  <!-- BM25 bar -->
  <rect x="290" y="467" width="67" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="290" y="483" fill="#64748b" font-size="10" dx="4">BM25  0.167</text>

  <!-- This system bar -->
  <rect x="290" y="492" width="234" height="22" rx="3" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="290" y="508" fill="#38bdf8" font-size="10" font-weight="600" dx="4">This system  0.585  (3.5× above baseline)</text>

  <!-- Arrowhead defs -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
